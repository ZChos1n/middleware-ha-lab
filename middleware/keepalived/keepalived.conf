# Keepalived VRRP config. Priorities differ per node (150 master / 100 backup).
# Uses unicast peers so it works on clouds where multicast is blocked.
vrrp_script chk_nginx {
    script "/usr/local/bin/check_nginx.sh"
    interval 2
    weight -20
    fall 3
    rise 2
}

vrrp_instance VI_1 {
    state MASTER              # change to BACKUP on node 2
    interface eth0
    virtual_router_id 51
    priority 150              # change to 100 on node 2
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass showcase_vrrp
    }
    virtual_ipaddress {
        172.20.0.100
    }
    track_script {
        chk_nginx
    }
    unicast_src_ip 172.20.0.11
    unicast_peer {
        172.20.0.12
    }
}
