global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: middleware-ha-lab

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: nginx
    static_configs: [{ targets: ["nginx-exporter:9113"] }]
    labels: { tier: web }

  - job_name: mysql
    static_configs: [{ targets: ["mysql-exporter:9104"] }]
    labels: { tier: data }

  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
    labels: { tier: data }

  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq-exporter:9419"] }]
    labels: { tier: mq }
